version: '3.9'
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: crisis_radar
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: crisis
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://crisis:crisis@db:5432/crisis_radar
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
